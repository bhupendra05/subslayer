[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subslayer"
version = "0.1.0"
description = "Find and kill forgotten subscriptions — point it at a bank statement and see exactly what's draining your money."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Bhupendra Gurjar", email = "bgurjar05.bg@gmail.com" }]
keywords = ["subscriptions", "personal-finance", "money", "bank-statement", "fintech", "savings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
]
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
subslayer = "subslayer.cli:main"

[project.urls]
Homepage = "https://github.com/bhupendra05/subslayer"

[tool.pytest.ini_options]
testpaths = ["tests"]
